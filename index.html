<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GOATA">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<title>GOATA Mobility</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#111;--muted:#76767c;--line:#e8e8eb;--dark:#0b0b0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--text)}
body{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 24px)}
.app{max-width:520px;margin:auto}
.hero{background:var(--dark);color:#fff;border-radius:28px;padding:22px 18px 18px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a2a2a8;font-weight:700}
h1{font-size:30px;line-height:1.05;margin:5px 0 8px;letter-spacing:-.03em}
.sub{font-size:13px;line-height:1.45;color:#bdbdc3;margin:0 0 15px}
.pRow{display:flex;justify-content:space-between;font-size:12px;color:#c8c8cd;margin-bottom:7px}
.bar{height:8px;background:#252528;border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:#fff;width:0%;border-radius:999px;transition:.2s}
.search{width:100%;margin-top:12px;border:0;border-radius:16px;padding:13px 14px;font-size:15px;background:#fff;outline:none}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 0 3px}
.chip{white-space:nowrap;border:0;border-radius:999px;background:#fff;padding:9px 12px;font-size:12px;font-weight:650;color:#555}
.chip.on{background:#111;color:#fff}
.section{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#85858b;font-weight:800;margin:16px 4px 7px}
.card{background:#fff;border-radius:21px;margin:8px 0;overflow:hidden;border:1px solid rgba(0,0,0,.035)}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:14px}
.check{width:28px;height:28px;border-radius:50%;border:1.5px solid #cfcfd4;background:#fff;color:transparent}
.card.done .check{background:#111;border-color:#111;color:#fff}
.card.done .name{text-decoration:line-through;color:#999}
.name{font-size:15px;font-weight:720;line-height:1.2}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.actions{display:flex;align-items:center;gap:7px}
.wbox{display:flex;align-items:center;background:#f1f1f3;border-radius:11px;padding:6px 8px}
.w{width:38px;border:0;background:transparent;text-align:right;font-size:14px;font-weight:650;outline:none}
.unit{font-size:10px;color:#85858b;margin-left:3px}
.more{width:30px;height:30px;border-radius:50%;border:0;background:#f1f1f3;color:#666}
.details{display:none;border-top:1px solid var(--line);padding:14px}
.card.open .details{display:block}
.label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:#999;margin:4px 0 7px}
.guide{font-size:13px;line-height:1.5;color:#444;margin:0}
ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:#4d4d52}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;background:#fafafa;padding:11px;font:inherit;font-size:13px;outline:none}
.reset{width:100%;margin-top:12px;border:0;background:#e7e7ea;border-radius:15px;padding:12px;font-size:13px;font-weight:700;color:#444}
.foot{text-align:center;color:#85858b;font-size:11px;line-height:1.5;padding:18px 20px 3px}
</style>
</head>
<body>
<main class="app">
<section class="hero">
<div class="eyebrow">Active Rest</div>
<h1>GOATA + Mobility</h1>
<p class="sub">Loaded mobility, movement patterning and recovery. Use load to deepen range while keeping effort around RPE 3–5.</p>
<div class="pRow"><span id="ptxt">0 / 0 complete</span><span id="ppct">0%</span></div>
<div class="bar"><div id="pbar"></div></div>
</section>
<input class="search" id="search" placeholder="Search exercises">
<div class="filters" id="filters"></div>
<div id="list"></div>
<button class="reset" id="reset">Reset today's checkmarks</button>
<div class="foot">Weights and notes save automatically on this iPhone.</div>
</main>
<script>
const raw = [
["Warm-up","Treadmill Walk","5–8 min",0,"Easy walk until hips, ankles and trunk feel warm.","Relax shoulders|Natural stride|Easy nasal breathing if comfortable"],
["Warm-up","Backward Treadmill Walk","2 × 1 min",0,"Walk backward slowly with short controlled steps.","Stay tall|Short quiet steps|Keep effort easy"],
["Hip Mobility","Weighted Child's Pose Rockback","2 × 10",1,"Sit the hips toward the heels while a light load helps you relax deeper.","Long spine|Exhale backward|Do not force hip range"],
["Hip Mobility","GOATA Cross-Behind Hip Rock","2 × 8 / side",0,"Use a staggered or cross-behind position and slowly rock the hips backward.","Move slowly|Allow natural hip rotation|Pain-free range"],
["Hip Mobility","90/90 Hip Switch","2 × 8 / side",0,"Rotate both knees side to side from a seated 90/90 position.","Rotate from hips|Smooth motion|Use hands if needed"],
["Loaded Mobility","Weighted 90/90 Forward Fold","2 × 30 sec / side",1,"Hinge forward over the front shin using light load to deepen the stretch.","Hinge at hips|Long chest|Slow breathing"],
["Loaded Mobility","Weighted 90/90 Rear-Leg Lean","2 × 30 sec / side",1,"Bias the rear hip from 90/90 with a gentle lean or rotation.","Keep rear knee comfortable|Light load|Do not crank the spine"],
["Loaded Mobility","Weighted Adductor Rockback","2 × 8 / side",1,"Extend one leg sideways from all fours and rock the hips backward.","Foot planted|Hips back|Brief pause at end range"],
["Feet & Ankles","Weighted Knee-Over-Toe Ankle Mobilization","2 × 10 / side",1,"Drive the knee forward over the foot while the heel stays down.","Heel planted|Natural knee track|Controlled reps"],
["Feet & Ankles","Deficit Calf Raise with Deep Stretch","2 × 8 • 3–5 sec bottom",1,"Lower the heel below a step into a deep controlled calf stretch.","Slow descent|Big toe connected|No bouncing"],
["Feet & Ankles","Tibialis Raise","2 × 12",1,"Lift the forefoot toward the shin while keeping heels planted.","Move at ankle|Control the top|Stop before fatigue dominates"],
["Feet & Ankles","Toe Walk","2 × 20–30 steps",0,"Walk slowly on the balls of the feet with good balance.","Stay tall|Quiet steps|Stop before calf burn"],
["GOATA Patterning","Deep Goblet Squat","2 × 6 • 3–5 sec bottom",1,"Use the weight as a counterbalance and sink into your deepest comfortable squat.","Whole foot down|Natural knee track|Relax into bottom"],
["Loaded Mobility","Goblet Squat Pry","2 × 30–45 sec",1,"Sit in a deep goblet squat and gently shift side to side.","Counterbalance, not strength work|Stay relaxed|Keep breathing"],
["GOATA Patterning","Front-Foot-Elevated Split Squat","2 × 6 / side • 3 sec bottom",1,"Elevate the front foot and descend slowly into range.","Front foot planted|Allow knee travel|Rear hip extends"],
["GOATA Patterning","Weighted Split-Squat Iso Hold","2 × 20–30 sec / side",1,"Hold a comfortable split-squat position under low effort.","RPE 3–5|Breathe|Whole front foot loaded"],
["GOATA Patterning","Single-Leg RDL","2 × 6 / side",1,"Hinge on one leg while the free leg reaches backward.","Stable stance foot|Reach back leg long|Natural pelvic rotation"],
["Loaded Mobility","Cossack Squat","2 × 6 / side",1,"Shift into one hip while the other leg straightens.","Sit into hip|Working foot planted|Use weight for balance"],
["GOATA Patterning","Walking Lunge with Rotation","2 × 6 / side",1,"Use a shallow-to-moderate lunge and allow natural trunk and pelvis rotation.","Smooth transfer|Light load|Think gait, not leg training"],
["Locomotion","Light Sled Push","2 × 20–30 m",1,"Push at an easy pace with rhythmic steps.","Stay relaxed|Smooth stride|Not conditioning"],
["Locomotion","Backward Sled Drag","2 × 20–30 m",1,"Walk backward continuously with a light sled.","Short steps|Stay upright|Low effort"],
["Locomotion","Cross-Step / Carioca Walk","2 × 20 m / side",0,"Move laterally while crossing one foot in front and behind.","Light feet|Let pelvis rotate|Stay coordinated"],
["Loaded Mobility","Weighted Deep Squat Hold","2 × 30–60 sec",1,"Use a light weight as counterbalance and relax into the squat.","Stay loose|Shift gently|Long exhales"],
["Loaded Mobility","Dumbbell Jefferson Curl","2 × 6–8",1,"With very light load, slowly flex down through the spine and reverse gradually.","Very light load|Slow motion|Stop before discomfort"],
["Loaded Mobility","Weighted Pancake Good Morning","2 × 8",1,"Use a wide stance and hinge forward from the hips under light load.","Hips back|Long chest|Load deepens hinge"],
["Loaded Mobility","Weighted Butterfly Stretch","2 × 30–45 sec",1,"Bring soles together and allow the hips to relax open.","Do not force knees|Long exhales|Light external pressure only"],
["Hip Mobility","Couch Stretch","2 × 30–45 sec / side",0,"Rear shin supported against wall or bench while torso rises.","Rear glute lightly squeezed|Ribs stacked|Avoid knee compression"],
["Loaded Mobility","Weighted Hip-Flexor Stretch","2 × 30 sec / side",1,"Half-kneeling stretch with controlled pelvis and light external load.","Slight posterior pelvic tilt|Rear glute on|Do not overarch"],
["Upper Body","Open Book Thoracic Rotation","2 × 6 / side",0,"Side-lying rotation of the upper back while lower body stays quiet.","Follow hand with eyes|Exhale into rotation|Smooth range"],
["Upper Body","Bench Lat Stretch","2 × 30 sec",1,"Hands or elbows on bench while chest sinks down.","Control ribs|Relax chest down|Avoid aggressive shrugging"],
["Upper Body","Dead Hang","2 × 30–45 sec",1,"Hang comfortably from a pull-up bar. Add load only if shoulders tolerate it.","Relax shoulders upward|Easy grip|Step down if pinching"],
["Upper Body","Scapular CARs","1 × 5 each direction",0,"Move shoulder blades through slow controlled circles.","Straight elbows|Move scapulae, not torso|Largest pain-free circle"],
["Recovery","90/90 Breathing","3–5 min",0,"Lie on your back with calves supported and breathe slowly.","Inhale ~4 sec|Exhale ~6–8 sec|Finish calmer than you started"]
];
const ex = raw.map((r,i)=>({id:"e"+i,cat:r[0],name:r[1],rx:r[2],weighted:!!r[3],guide:r[4],cues:r[5].split("|")}));
const cats=["All",...new Set(ex.map(x=>x.cat))];
let active="All";
const key="goata-iphone-v2";
let st={}; try{st=JSON.parse(localStorage.getItem(key)||"{}")}catch(e){}
function get(id){return st[id]||(st[id]={done:false,weight:"",notes:""})}
function save(){localStorage.setItem(key,JSON.stringify(st))}
function filters(){
 const f=document.getElementById("filters");f.innerHTML="";
 cats.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c===active?" on":"");b.textContent=c;b.onclick=()=>{active=c;filters();render()};f.appendChild(b)})
}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim(), list=document.getElementById("list"); list.innerHTML="";
 let last="";
 ex.filter(x=>(active==="All"||x.cat===active)&&(!q||x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q))).forEach(x=>{
   if(active==="All"&&x.cat!==last){const h=document.createElement("div");h.className="section";h.textContent=x.cat;list.appendChild(h);last=x.cat}
   const s=get(x.id), card=document.createElement("div");card.className="card"+(s.done?" done":"");
   const row=document.createElement("div");row.className="row";
   const ck=document.createElement("button");ck.className="check";ck.textContent="✓";ck.onclick=()=>{s.done=!s.done;save();render()};
   const mid=document.createElement("div");mid.innerHTML=`<div class="name">${x.name}</div><div class="meta">${x.rx}</div>`;
   const acts=document.createElement("div");acts.className="actions";
   if(x.weighted){const wb=document.createElement("div");wb.className="wbox";const wi=document.createElement("input");wi.className="w";wi.type="number";wi.inputMode="decimal";wi.placeholder="0";wi.value=s.weight||"";wi.onclick=e=>e.stopPropagation();wi.oninput=e=>{s.weight=e.target.value;save()};const u=document.createElement("span");u.className="unit";u.textContent="lb";wb.append(wi,u);acts.appendChild(wb)}
   const more=document.createElement("button");more.className="more";more.textContent="⌄";acts.appendChild(more);
   row.append(ck,mid,acts);
   const det=document.createElement("div");det.className="details";det.innerHTML=`<div class="label">How to do it</div><p class="guide">${x.guide}</p><div class="label">Cues</div><ul>${x.cues.map(c=>`<li>${c}</li>`).join("")}</ul><div class="label">Your notes</div>`;
   const ta=document.createElement("textarea");ta.placeholder="Example: 35 lb felt right. Left hip tighter today.";ta.value=s.notes||"";ta.oninput=e=>{s.notes=e.target.value;save()};det.appendChild(ta);
   const toggle=()=>card.classList.toggle("open");mid.onclick=toggle;more.onclick=toggle;
   card.append(row,det);list.appendChild(card);
 });
 const done=ex.filter(x=>get(x.id).done).length,p=Math.round(done/ex.length*100);
 document.getElementById("ptxt").textContent=`${done} / ${ex.length} complete`;document.getElementById("ppct").textContent=p+"%";document.getElementById("pbar").style.width=p+"%";save()
}
document.getElementById("search").oninput=render;
document.getElementById("reset").onclick=()=>{ex.forEach(x=>get(x.id).done=false);save();render()};
filters();render();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
